services:
  - type: web
    name: digital-expiry-tracker-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p /var/data/uploads && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: expiry_tracker_data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/expiry_tracker.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ENABLE_DEMO_USER
        value: "false"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: ENABLE_OCR
        value: "true"
      - key: ENABLE_EXPIRY_ALERT_SCHEDULER
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false